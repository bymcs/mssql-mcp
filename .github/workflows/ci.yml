name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'P@ssw0rd_CI_2024!' }}
        ports:
          - 1433:1433

    env:
      DB_SERVER: localhost
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'P@ssw0rd_CI_2024!' }}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Integration test (live SQL Server)
        run: npm run test:integration

      - name: Verify package
        run: npm pack --dry-run
